<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Reuse a computation by changing where it reads</title>
<desc id="desc">A table stores pine mapped to c. A fitted query-key routing edit directs an existing successor-associated head to c, so the model often predicts d. The value-output weights are retained apart from a gain.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3467b1"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="438" rx="20" fill="#f5f7fb" stroke="#dce3ed"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="38" y="43" fill="#3467b1" font-size="13" font-weight="700" letter-spacing="2">ROUTING EDITS</text>
  <text x="38" y="85" fill="#172a43" font-size="30" font-weight="700">Reuse a computation by changing where it reads.</text>
  <text x="38" y="116" fill="#52647a" font-size="17">A permanent attention edit inside a pretrained language model</text>

  <rect x="38" y="150" width="300" height="228" rx="14" fill="#fff" stroke="#dce3ed"/>
  <text x="60" y="183" fill="#52647a" font-size="13" font-weight="700" letter-spacing="1">LOOKUP PROMPT</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#172a43">
    <text x="62" y="222">oak  → h</text>
    <rect x="54" y="233" width="268" height="35" rx="6" fill="#e7effd"/>
    <text x="62" y="258">pine → <tspan fill="#245ba7" font-weight="700">c</tspan></text>
    <text x="62" y="295">elm  → q</text>
    <text x="62" y="350" font-weight="700">pine →</text>
  </g>

  <path d="M 350 265 L 404 265" fill="none" stroke="#3467b1" stroke-width="3"/>
  <path d="M 404 259 L 414 265 L 404 271 Z" fill="#3467b1"/>
  <rect x="431" y="190" width="312" height="150" rx="14" fill="#e7effd" stroke="#aac3ed"/>
  <text x="454" y="221" fill="#245ba7" font-size="13" font-weight="700" letter-spacing="1">REWRITE QUERY / KEY WEIGHTS</text>
  <text x="454" y="259" fill="#172a43" font-size="23" font-weight="700">Read the queried value.</text>
  <text x="454" y="291" fill="#52647a" font-size="16">Fit on ordinary-word position labels</text>
  <text x="454" y="316" fill="#52647a" font-size="16">Gain selected on development results</text>

  <path d="M 756 265 L 810 265" fill="none" stroke="#3467b1" stroke-width="3"/>
  <path d="M 810 259 L 820 265 L 810 271 Z" fill="#3467b1"/>
  <rect x="837" y="190" width="325" height="150" rx="14" fill="#fff" stroke="#dce3ed"/>
  <text x="858" y="221" fill="#52647a" font-size="13" font-weight="700" letter-spacing="1">RETAIN VALUE / OUTPUT WEIGHTS*</text>
  <text x="858" y="262" fill="#172a43" font-size="21" font-weight="700">Existing successor circuit</text>
  <text x="858" y="315" fill="#245ba7" font-size="34" font-weight="700">c → d</text>
  <text x="986" y="313" fill="#52647a" font-size="16">often predicted</text>

  <text x="38" y="411" fill="#52647a" font-size="14">* Apart from an output gain. Demonstrated in two Qwen3 models; collateral damage is measured in the paper.</text>
</g>
</svg>
